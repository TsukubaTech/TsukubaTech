    <radialGradient id="glow" cx="0.9" cy="0" r="0.8"><stop offset="0" stop-color="#93c5fd" stop-opacity="0.22"/><stop offset="1" stop-color="#93c5fd" stop-opacity="0"/></radialGradient>
