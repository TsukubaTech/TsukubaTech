<svg xmlns="http://www.w3.org/2000/svg" width="440" height="276" viewBox="0 0 440 276" role="img" aria-label="LEO: Personal AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1520"/><stop offset="1" stop-color="#080c12"/></linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0" r="0.8"><stop offset="0" stop-color="#22c55e" stop-opacity="0.22"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e" stop-opacity="0"/><stop offset="0.5" stop-color="#22c55e"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></linearGradient>
    <style>
      .name { font: 700 14px 'Cascadia Code', 'SF Mono', Consolas, monospace; letter-spacing: 3px; fill: #22c55e; }
      .title { font: 700 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f2f7fb; }
      .body { font: 400 15.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9fb3c8; }
      .tag { font: 600 12.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #dbe7f3; }
      .run { animation: run 4s ease-in-out infinite; }
      @keyframes run { 0% { transform: translateX(-440px); } 60%, 100% { transform: translateX(440px); } }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: 0; } }
    </style>
    <clipPath id="clip"><rect width="440" height="276" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="276" fill="url(#bg)"/>
    <rect width="440" height="276" fill="url(#glow)"/>
    <g class="run"><rect y="0" width="440" height="2" fill="url(#edge)"/></g>
  </g>
  <rect x="0.5" y="0.5" width="439" height="275" rx="15.5" fill="none" stroke="#1e2d3d"/>
  <g transform="translate(350 24)"><rect x="10" y="29" width="7" height="14" rx="3.5" fill="#22c55e"><animate attributeName="height" values="14;34;14" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="29;19;29" dur="1.2s" repeatCount="indefinite"/></rect><rect x="22" y="21" width="7" height="30" rx="3.5" fill="#22c55e"><animate attributeName="height" values="30;18;30" dur="1.3499999999999999s" repeatCount="indefinite"/><animate attributeName="y" values="21;27;21" dur="1.3499999999999999s" repeatCount="indefinite"/></rect><rect x="34" y="14" width="7" height="44" rx="3.5" fill="#22c55e"><animate attributeName="height" values="44;8;44" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="14;32;14" dur="1.5s" repeatCount="indefinite"/></rect><rect x="46" y="23" width="7" height="26" rx="3.5" fill="#22c55e"><animate attributeName="height" values="26;22;26" dur="1.65s" repeatCount="indefinite"/><animate attributeName="y" values="23;25;23" dur="1.65s" repeatCount="indefinite"/></rect><rect x="58" y="27" width="7" height="18" rx="3.5" fill="#22c55e"><animate attributeName="height" values="18;30;18" dur="1.7999999999999998s" repeatCount="indefinite"/><animate attributeName="y" values="27;21;27" dur="1.7999999999999998s" repeatCount="indefinite"/></rect></g>
  <text x="32" y="52" class="name">LEO</text>
  <text x="32" y="96" class="title">Personal AI assistant</text>
  <text x="32" y="150" class="body">Talks, works on your Windows PC, browses the</text><text x="32" y="174" class="body">web and runs jobs while you are away, and asks</text><text x="32" y="198" class="body">before it does anything important.</text>
  <rect x="32" y="222" width="82.80000000000001" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.35"/><text x="73.4" y="239.5" text-anchor="middle" class="tag">Windows</text><rect x="124.80000000000001" y="222" width="66" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.35"/><text x="157.8" y="239.5" text-anchor="middle" class="tag">Phone</text><rect x="200.8" y="222" width="66" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.35"/><text x="233.8" y="239.5" text-anchor="middle" class="tag">Voice</text>
</svg>
