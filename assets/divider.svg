<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b97e8" stop-opacity="0"/><stop offset="0.5" stop-color="#0b97e8" stop-opacity="0.55"/><stop offset="1" stop-color="#0b97e8" stop-opacity="0"/></linearGradient>
    <radialGradient id="d"><stop offset="0" stop-color="#c9ecff"/><stop offset="0.4" stop-color="#3cc0ff"/><stop offset="1" stop-color="#3cc0ff" stop-opacity="0"/></radialGradient>
    <style>.dot { animation: go 5s ease-in-out infinite; } @keyframes go { 0% { transform: translateX(100px); } 50% { transform: translateX(800px); } 100% { transform: translateX(100px); } } @media (prefers-reduced-motion: reduce) { .dot { animation: none; transform: translateX(450px); } }</style>
  </defs>
  <rect y="5.5" width="900" height="1" fill="url(#l)"/>
  <g class="dot"><circle cy="6" r="6" fill="url(#d)"/></g>
</svg>
