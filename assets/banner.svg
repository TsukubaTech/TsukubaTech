<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Tsukuba Tech — AI assistants and web platforms, built in Japan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a10"/>
      <stop offset="1" stop-color="#0b1622"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#0b97e8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0b97e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22aef5"/>
      <stop offset="0.6" stop-color="#0b8fdc"/>
      <stop offset="1" stop-color="#0c5a91"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a2a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <clipPath id="word"><text x="372" y="178" class="w">TSUKUBA TECH</text></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .w { font: 800 80px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 5px; }
      .tag { font: 500 23px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9fb3c8; letter-spacing: 0.5px; }
      .mono { font: 600 15px 'Cascadia Code', 'SF Mono', Consolas, monospace; fill: #0b97e8; letter-spacing: 3px; }
      .trace { fill: none; stroke: #16324a; stroke-width: 2; }
      .pad { fill: #060a10; stroke: #1d4a6e; stroke-width: 2; }
      .pulse { fill: #3cc0ff; filter: url(#soft); }
      .core { fill: #c9ecff; }
      .rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
      .sweep { animation: sweep 6s ease-in-out 1.4s infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes sweep { 0% { transform: translateX(-260px); } 45%, 100% { transform: translateX(820px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .sweep, .blink { animation: none; }
        .sweep { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)" mask="url(#gridMask)" opacity="0.6"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- circuit traces on the right -->
  <g>
    <path id="t1" class="trace" d="M1200 64 H1060 L1030 94 H930"/>
    <path id="t2" class="trace" d="M1200 132 H1110 L1080 102 H1000"/>
    <path id="t3" class="trace" d="M1200 248 H1090 L1050 288 H900"/>
    <path id="t4" class="trace" d="M1200 300 H1140 L1120 280 H1010"/>
    <circle class="pad" cx="930" cy="94" r="6"/>
    <circle class="pad" cx="1000" cy="102" r="6"/>
    <circle class="pad" cx="900" cy="288" r="6"/>
    <circle class="pad" cx="1010" cy="280" r="6"/>
    <g>
      <circle class="pulse" r="5"><animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#t1"/></animateMotion></circle>
      <circle class="core" r="2"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
      <circle class="pulse" r="5"><animateMotion dur="2.6s" begin="1s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
      <circle class="core" r="2"><animateMotion dur="2.6s" begin="1s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
      <circle class="pulse" r="5"><animateMotion dur="3.6s" begin=".5s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion></circle>
      <circle class="core" r="2"><animateMotion dur="3.6s" begin=".5s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion></circle>
      <circle class="pulse" r="5"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion></circle>
      <circle class="core" r="2"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion></circle>
    </g>
  </g>

  <!-- mountain-circuit mark -->
  <g transform="translate(70 62) scale(0.4)"><g class="rise">
    <g fill="none" stroke="url(#mark)" stroke-width="68" stroke-linejoin="miter" stroke-miterlimit="10">
      <path d="M40 520 L250 150 L410 418"/>
      <path d="M318 268 L440 70 L622 418"/>
      <circle cx="430" cy="470" r="46" stroke-width="50"/>
      <circle cx="640" cy="470" r="46" stroke-width="50"/>
    </g>
  </g></g>

  <!-- wordmark -->
  <g class="rise d1">
    <text x="372" y="178" class="w"><tspan fill="#f2f7fb">TSUKUBA </tspan><tspan fill="#0b97e8">TECH</tspan></text>
    <g clip-path="url(#word)">
      <g class="sweep"><rect x="400" y="90" width="110" height="110" fill="url(#sheen)" transform="skewX(-20)"/></g>
    </g>
  </g>
  <text x="376" y="226" class="tag rise d2">AI assistants and the web platforms that run them</text>
  <g class="rise d3">
    <text x="376" y="270" class="mono">BUILT IN JAPAN  ·  LEO  ·  TANZZ AI  ·  STUDIO</text>
    <rect class="blink" x="862" y="257" width="9" height="16" fill="#0b97e8"/>
  </g>
</svg>
