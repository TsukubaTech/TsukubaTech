<svg xmlns="http://www.w3.org/2000/svg" width="440" height="276" viewBox="0 0 440 276" role="img" aria-label="TANZZ AI: The brain behind Leo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1520"/><stop offset="1" stop-color="#080c12"/></linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0" r="0.8"><stop offset="0" stop-color="#0b97e8" stop-opacity="0.22"/><stop offset="1" stop-color="#0b97e8" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b97e8" stop-opacity="0"/><stop offset="0.5" stop-color="#0b97e8"/><stop offset="1" stop-color="#0b97e8" stop-opacity="0"/></linearGradient>
    <style>
      .name { font: 700 14px 'Cascadia Code', 'SF Mono', Consolas, monospace; letter-spacing: 3px; fill: #0b97e8; }
      .title { font: 700 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f2f7fb; }
      .body { font: 400 15.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9fb3c8; }
      .tag { font: 600 12.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #dbe7f3; }
      .run { animation: run 4s ease-in-out infinite; }
      @keyframes run { 0% { transform: translateX(-440px); } 60%, 100% { transform: translateX(440px); } }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: 0; } }
    </style>
    <clipPath id="clip"><rect width="440" height="276" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="276" fill="url(#bg)"/>
    <rect width="440" height="276" fill="url(#glow)"/>
    <g class="run"><rect y="0" width="440" height="2" fill="url(#edge)"/></g>
  </g>
  <rect x="0.5" y="0.5" width="439" height="275" rx="15.5" fill="none" stroke="#1e2d3d"/>
  <g transform="translate(350 24)"><g stroke="#0b97e8" stroke-width="3" fill="none" opacity="0.7"><path d="M18 52 L36 18 L56 48 Z"/></g>
    <circle cx="36" cy="18" r="8" fill="#0b97e8"/><circle cx="18" cy="52" r="7" fill="#0b97e8" opacity="0.8"/><circle cx="56" cy="48" r="7" fill="#0b97e8" opacity="0.8"/>
    <circle cx="36" cy="18" r="8" fill="none" stroke="#0b97e8" stroke-width="2"><animate attributeName="r" values="8;18" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.2s" repeatCount="indefinite"/></circle></g>
  <text x="32" y="52" class="name">TANZZ AI</text>
  <text x="32" y="96" class="title">The brain behind Leo</text>
  <text x="32" y="150" class="body">Multi-model routing, per-company knowledge,</text><text x="32" y="174" class="body">and drop-in support and translation widgets</text><text x="32" y="198" class="body">for any website.</text>
  <rect x="32" y="222" width="49.2" height="26" rx="13" fill="#0b97e8" fill-opacity="0.12" stroke="#0b97e8" stroke-opacity="0.35"/><text x="56.6" y="239.5" text-anchor="middle" class="tag">API</text><rect x="91.2" y="222" width="99.60000000000001" height="26" rx="13" fill="#0b97e8" fill-opacity="0.12" stroke="#0b97e8" stroke-opacity="0.35"/><text x="141" y="239.5" text-anchor="middle" class="tag">Knowledge</text><rect x="200.8" y="222" width="82.80000000000001" height="26" rx="13" fill="#0b97e8" fill-opacity="0.12" stroke="#0b97e8" stroke-opacity="0.35"/><text x="242.20000000000002" y="239.5" text-anchor="middle" class="tag">Widgets</text>
</svg>
