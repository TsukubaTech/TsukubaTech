<svg xmlns="http://www.w3.org/2000/svg" width="440" height="276" viewBox="0 0 440 276" role="img" aria-label="TANZZ STUDIO: AI-assisted CMS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1520"/><stop offset="1" stop-color="#080c12"/></linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0" r="0.8"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
    <style>
      .name { font: 700 14px 'Cascadia Code', 'SF Mono', Consolas, monospace; letter-spacing: 3px; fill: #38bdf8; }
      .title { font: 700 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f2f7fb; }
      .body { font: 400 15.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9fb3c8; }
      .tag { font: 600 12.5px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #dbe7f3; }
      .run { animation: run 4s ease-in-out infinite; }
      @keyframes run { 0% { transform: translateX(-440px); } 60%, 100% { transform: translateX(440px); } }
      @media (prefers-reduced-motion: reduce) { .run { animation: none; opacity: 0; } }
    </style>
    <clipPath id="clip"><rect width="440" height="276" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="440" height="276" fill="url(#bg)"/>
    <rect width="440" height="276" fill="url(#glow)"/>
    <g class="run"><rect y="0" width="440" height="2" fill="url(#edge)"/></g>
  </g>
  <rect x="0.5" y="0.5" width="439" height="275" rx="15.5" fill="none" stroke="#1e2d3d"/>
  <g transform="translate(350 24)"><g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round">
